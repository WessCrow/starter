v: "5.1"
updated: "2026-08-21"

resolution:
  order: [local-skills, linked-skills, skills.sh, cache/remote-skills]
  max_skills: 3
  max_primary: 1
  max_secondary: 2

protocol:
  name: specialist_asks
  never_execute_without_confirmation: true

intents:
  comecar_projeto:
    primary: project-starter
    protocol: flows/kickoff.md
    triggers: [Começar projeto, Comecar projeto, Iniciar projeto, Novo projeto]
    user_facing: true
  post_implement_qa:
    primary: qa-gate
    secondary: [qa-smoke]
    mandatory: true
    blocks_feature_done_without_pass: true
  new_project:
    primary: project-starter
    protocol: flows/kickoff.md
  video_html_motion:
    primary: hyperframes
    triggers: [HyperFrames, video em HTML, composição de vídeo, motion graphics, captions]
  hyperframes_cli_devloop:
    primary: hyperframes-cli
    triggers: [npx hyperframes, preview, render, lint, inspect, doctor]
  hyperframes_media_preprocessing:
    primary: hyperframes-media
    triggers: [tts, transcribe, remove-background, voiceover, transcript, legenda]
  ui_component_visual:
    primary: interface-design

activation_matrix:
  novo:
    squad: [orchestrator, product_strategist, architect]
    steps: [kickoff, plan, contract]
  feature_lite:
    squad: [orchestrator, implementer, independent_qa]
    steps: [specify, human_approval, implement, qa_verification]
  feature_full:
    squad: [orchestrator, product_strategist, architect, implementer, independent_qa, doc_writer]
    steps: [specify, clarify, plan, tasks, contract, human_approval, implement, qa_verification, documentation]
  ajuste:
    squad: [implementer, local_qa]
    steps: [implement, smoke_check]
  figma:
    squad: [orchestrator, designer, implementer, independent_qa, doc_writer]
    steps: [fidelity_gate, implement, qa_verification, documentation]
  doc:
    squad: [doc_writer]
    steps: [document]
